# Versiones de Iris con release-please:
#
# 1. Cada push a main actualiza (o abre) la PR "chore: publicar versión X.Y.Z" con la versión que
#    sale de los Conventional Commits y el CHANGELOG.md en español (secciones en
#    release-please-config.json). La primera es 0.1.0 (release-as en la config).
# 2. Al mergear esa PR, release-please crea la etiqueta vX.Y.Z y la GitHub Release.
# 3. Con la versión creada, el job `apk` compila el APK de Android de la app de campo
#    (movil-apk.yml, reutilizable) y lo adjunta a la release como iris-campo-X.Y.Z.apk; la URL de la
#    API sale de la variable del repo IRIS_MOVIL_API_URL (docs/runbooks/movil-apk.md).
# 4. Con la versión creada, el job `imagenes` publica en GHCR ghcr.io/<dueño>/iris-api,
#    iris-worker e iris-web con las etiquetas X.Y.Z y latest (las mismas que construye y prueba
#    imagenes.yml en cada PR; VERSION queda en main.version de api y worker).
# 5. Con las imágenes publicadas, el job `paquete` adjunta a la release el instalador de producción
#    (infra/produccion/package.sh): iris-X.Y.Z.tar.gz, su .sha256, install.sh e install.sh.sha256
#    (en inglés por decisión del PM; docs/runbooks/install.md). Para adjuntarlo a una release que ya
#    existe (p. ej. una anterior a este job): workflow_dispatch con `version` = X.Y.Z; el paquete
#    sale del commit despachado y usa las imágenes X.Y.Z de GHCR.
#
# La PR de release-please la abre GITHUB_TOKEN, así que el CI no corre solo en ella: ciérrala y
# vuelve a abrirla (o corre CI con workflow_dispatch en su rama) antes de mergear (CLAUDE.md §12).
name: Versión

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Install package only — attach it to the existing release vX.Y.Z (e.g. 0.2.0)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: version-main
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      creada: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  imagenes:
    name: Publicar imágenes
    needs: release-please
    if: needs.release-please.outputs.creada == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Entrar a GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Construir y publicar
        run: |
          dueno="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          base="ghcr.io/$dueno"
          docker build -f apps/api/Dockerfile --target api --build-arg VERSION="$VERSION" \
            -t "$base/iris-api:$VERSION" -t "$base/iris-api:latest" .
          docker build -f apps/api/Dockerfile --target worker --build-arg VERSION="$VERSION" \
            -t "$base/iris-worker:$VERSION" -t "$base/iris-worker:latest" .
          docker build -f apps/web/Dockerfile -t "$base/iris-web:$VERSION" -t "$base/iris-web:latest" .
          for i in iris-api iris-worker iris-web; do
            docker push "$base/$i:$VERSION"
            docker push "$base/$i:latest"
            echo "$base/$i:$VERSION" >>"$GITHUB_STEP_SUMMARY"
          done

  # La release la crea GITHUB_TOKEN y eso no dispara `release: published`: se llama aquí.
  apk:
    name: APK de Android
    needs: release-please
    if: needs.release-please.outputs.creada == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/movil-apk.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    # Solo los de la firma (sin `inherit`). Si viven en el environment android-firma, el job que
    # firma los toma de ahí.
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  # Paquete de instalación (A6 de Argos como modelo): va al final, cuando las imágenes ya existen,
  # porque install.sh e `irisctl upgrade` solo ven una versión cuando su paquete está publicado.
  paquete:
    name: Paquete de instalación
    needs: [release-please, imagenes]
    if: >-
      always() &&
      ((needs.release-please.outputs.creada == 'true' && needs.imagenes.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.version != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release-please.outputs.version || inputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Armar y adjuntar a la release
        run: |
          VERSION="${VERSION#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::versión inválida: '$VERSION'"; exit 1; }
          gh release view "v$VERSION" >/dev/null || { echo "::error::no existe la release v$VERSION"; exit 1; }
          infra/produccion/package.sh "$VERSION" dist
          gh release upload "v$VERSION" --clobber \
            "dist/iris-$VERSION.tar.gz#Iris $VERSION production install package" \
            "dist/iris-$VERSION.tar.gz.sha256#Iris $VERSION install package SHA-256" \
            "dist/install.sh#Iris installer (install.sh)" \
            "dist/install.sh.sha256#Iris installer SHA-256"
          {
            echo "### Install package v$VERSION"
            echo '```'
            cat "dist/iris-$VERSION.tar.gz.sha256" dist/install.sh.sha256
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
