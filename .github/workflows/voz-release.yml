# Publica una versión de «Iris Voz» (Servidor de IA, contrato voz.md §4.7). Versión propia,
# independiente de la de Iris: se publica al empujar una etiqueta voz-vX.Y.Z (protegida: solo quien
# puede publicar puede crearla), que debe coincidir con infra/voz/manifiesto.json y estar en main.
# La etiqueta la crea sola voz-etiqueta.yml (con una GitHub App, cuyo push sí dispara este workflow)
# cuando sube `version` en el manifiesto en main; también se puede crear a mano.
#
# Tres jobs con los permisos mínimos de cada uno:
#
# 1. construir (packages: write): comprueba los archivos, construye y publica la imagen
#    ghcr.io/<dueño>/iris-voz:X.Y.Z y arma el paquete con la imagen fijada por digest.
#    Antes, el job `entorno` comprueba que el commit de la etiqueta está en main y que el entorno
#    `voz-release` existe y exige revisores: si no, nada se construye ni se firma (GitHub crearía el
#    entorno vacío y los jobs correrían sin aprobación).
# 2. firmar (id-token: write, nada más; entorno `voz-release`, con aprobación): firma el paquete, el instalador y el manifiesto con cosign
#    SIN CLAVE. La identidad es este workflow en esta etiqueta (OIDC de GitHub Actions); no hay claves
#    ni secretos que guardar. No hace checkout ni ejecuta nada del repositorio: baja cosign fijado
#    por sha256, comprueba las sumas que exportó `construir` y firma esos tres archivos. Nada se
#    firma (ni queda en el registro de transparencia) sin la aprobación del entorno.
# 3. publicar (contents: write; entorno `voz-release`, con aprobación): verifica lo firmado SIN RED,
#    con la raíz de confianza embebida en install-voz.sh y la misma función que usa el instalador,
#    contra la identidad real, y que otra identidad, un paquete alterado y un bundle sin registro de
#    transparencia fallan (infra/voz/prueba-firma.sh). Después crea la release voz-vX.Y.Z (no
#    «latest»: esa es la de Iris).
#
# install-voz.sh solo acepta paquetes firmados por
#   https://github.com/HCDestroyer/iris/.github/workflows/voz-release.yml@refs/tags/voz-vX.Y.Z
# así que este archivo no se puede renombrar sin publicar un instalador nuevo.
#
# Requisitos del repositorio (docs/runbooks/servidor-ia.md §8): una regla de etiquetas que proteja
# voz-v* y el entorno `voz-release` con revisores obligatorios.
name: Versión de Iris Voz

on:
  push:
    tags: ['voz-v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

concurrency:
  group: voz-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  entorno:
    name: Etiqueta en main y entorno con aprobación
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: El commit de la etiqueta está en main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Solo se publica lo que ya pasó por main (revisión y CI), nunca un commit de otra rama.
          estado="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)" ||
            { echo "::error::no se pudo comparar $GITHUB_SHA con main"; exit 1; }
          case "$estado" in
            identical | behind) ;;
            *) echo "::error::el commit $GITHUB_SHA de $GITHUB_REF_NAME no está en main ($estado)"; exit 1 ;;
          esac

      - name: Comprobar el entorno voz-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Falla cerrado: sin poder leer el entorno, sin entorno o sin revisores obligatorios, no se publica.
          revisores="$(gh api "repos/$GITHUB_REPOSITORY/environments/voz-release" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers | length] | add // 0')" ||
            { echo "::error::no existe (o no se puede leer) el entorno voz-release: créalo con revisores obligatorios (docs/runbooks/servidor-ia.md §8)"; exit 1; }
          [[ "$revisores" =~ ^[0-9]+$ ]] && [ "$revisores" -gt 0 ] ||
            { echo "::error::el entorno voz-release no tiene revisores obligatorios: nada se firma ni se publica sin aprobación"; exit 1; }

  construir:
    name: Construir la imagen y el paquete
    needs: entorno
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      sumas: ${{ steps.sumas.outputs.sumas }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Versión de la etiqueta y del manifiesto
        id: v
        run: |
          version="${GITHUB_REF_NAME#voz-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::etiqueta inválida: $GITHUB_REF_NAME"; exit 1; }
          en_manifiesto="$(jq -r .version infra/voz/manifiesto.json)"
          [ "$en_manifiesto" = "$version" ] || { echo "::error::la etiqueta dice $version y manifiesto.json dice $en_manifiesto"; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Comprobar los archivos del paquete
        run: infra/voz/verificar.sh

      - name: Entrar a GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Construir y publicar la imagen
        id: img
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          dueno="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          imagen="ghcr.io/$dueno/iris-voz:$VERSION"
          docker build -f infra/voz/Dockerfile --build-arg VERSION="$VERSION" -t "$imagen" .
          docker push "$imagen"
          digest="$(docker buildx imagetools inspect "$imagen" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no se pudo leer el digest de $imagen"; exit 1; }
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "$imagen@$digest" >>"$GITHUB_STEP_SUMMARY"

      - name: Armar el paquete (imagen fijada por digest)
        env:
          VERSION: ${{ steps.v.outputs.version }}
          IRIS_VOZ_DIGEST: ${{ steps.img.outputs.digest }}
        run: |
          IRIS_PIN_DIGESTS=1 IRIS_REGISTRY="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" \
            infra/voz/package-voz.sh "$VERSION" dist

      - name: Sumas de lo que se va a firmar
        id: sumas
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          {
            echo 'sumas<<FIN_SUMAS'
            (cd dist && sha256sum "iris-voz-$VERSION.tar.gz" install-voz.sh manifiesto.json)
            echo 'FIN_SUMAS'
          } >>"$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paquete
          path: dist/
          if-no-files-found: error
          retention-days: 7

  firmar:
    name: Firmar (cosign sin clave)
    needs: construir
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Entorno con revisores obligatorios: sin aprobación no se firma nada.
    environment: voz-release
    permissions:
      id-token: write
    env:
      VERSION: ${{ needs.construir.outputs.version }}
      SUMAS: ${{ needs.construir.outputs.sumas }}
      IDENTIDAD: ${{ github.server_url }}/${{ github.workflow_ref }}
      # El mismo cosign que fija install-voz.sh (infra/voz/verificar.sh comprueba que coinciden).
      COSIGN_VERSION: v2.6.1
      COSIGN_SHA256: 064954c5d8c7e3b28188eee5b1727b31c411550bc5fefd41aa672d3c761d103a
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: paquete
          path: dist

      - name: Firmar el paquete, el instalador y el manifiesto
        run: |
          esperada="https://github.com/HCDestroyer/iris/.github/workflows/voz-release.yml@refs/tags/voz-v$VERSION"
          [ "$IDENTIDAD" = "$esperada" ] || { echo "::error::la identidad de este workflow ($IDENTIDAD) no es la que acepta el instalador ($esperada)"; exit 1; }
          # Solo se firma lo que construyó el job anterior: las sumas vienen por su salida, no por el artefacto.
          [ "$(printf '%s\n' "$SUMAS" | grep -c .)" = 3 ] || { echo "::error::faltan las sumas de construir"; exit 1; }
          (cd dist && printf '%s\n' "$SUMAS" | sha256sum -c --strict -)
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o "$RUNNER_TEMP/cosign" \
            "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          echo "$COSIGN_SHA256  $RUNNER_TEMP/cosign" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/cosign"
          mkdir firmas
          for f in "iris-voz-$VERSION.tar.gz" install-voz.sh manifiesto.json; do
            [ -s "dist/$f" ] || { echo "::error::falta dist/$f"; exit 1; }
            "$RUNNER_TEMP/cosign" sign-blob --yes --new-bundle-format --bundle "firmas/$f.sigstore.json" "dist/$f" >/dev/null
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmas
          path: firmas/
          if-no-files-found: error
          retention-days: 7

  publicar:
    name: Verificar sin red y publicar
    needs: [construir, firmar]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Entorno con revisores obligatorios: nadie publica sin una aprobación.
    environment: voz-release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.construir.outputs.version }}
      IDENTIDAD: ${{ github.server_url }}/${{ github.workflow_ref }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: paquete
          path: dist

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: firmas
          path: dist

      - name: Verificar las firmas sin red (lo mismo que hará el instalador)
        run: |
          sudo -E env "PATH=$PATH" IRIS_VOZ_FIRMA_DIR="$PWD/dist" infra/voz/prueba-firma.sh "$IDENTIDAD"
          sudo rm -rf dist/bin dist/alterado.tar.gz dist/sin-tlog.sigstore.json

      - name: Crear la release
        run: |
          if gh release view "voz-v$VERSION" >/dev/null 2>&1; then echo "::error::ya existe la release voz-v$VERSION"; exit 1; fi
          gh release create "voz-v$VERSION" --latest=false --verify-tag --title "Iris Voz $VERSION" \
            --notes "AI server package for Iris (Iris Voz $VERSION). Install guide: docs/runbooks/servidor-ia.md. Verify install-voz.sh with its .sigstore.json bundle before running it." \
            "dist/iris-voz-$VERSION.tar.gz#Iris Voz $VERSION install package" \
            "dist/iris-voz-$VERSION.tar.gz.sigstore.json#Iris Voz $VERSION install package signature (Sigstore bundle)" \
            "dist/iris-voz-$VERSION.tar.gz.sha256#Iris Voz $VERSION install package SHA-256" \
            "dist/install-voz.sh#Iris Voz installer (install-voz.sh)" \
            "dist/install-voz.sh.sigstore.json#Iris Voz installer signature (Sigstore bundle)" \
            "dist/install-voz.sh.sha256#Iris Voz installer SHA-256" \
            "dist/manifiesto.json#Iris Voz $VERSION manifest" \
            "dist/manifiesto.json.sigstore.json#Iris Voz $VERSION manifest signature (Sigstore bundle)"
