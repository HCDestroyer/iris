name: Carga

# Prueba de carga (Fase 5): 50 técnicos sincronizando y el panel con 10 000 tickets abiertos.
# No corre en cada PR: a mano (workflow_dispatch) y cada lunes. Runbook: docs/runbooks/carga.md.

on:
  workflow_dispatch:
    inputs:
      duracion:
        description: Duración de los escenarios de k6 (p. ej. 15m o 2m)
        default: 15m
      tecnicos:
        description: Técnicos virtuales (hasta 50)
        default: '50'
      panel:
        description: Usuarios del panel (hasta 20)
        default: '20'
  schedule:
    # Lunes 08:17 UTC (02:17 en Guatemala), fuera del horario de trabajo.
    - cron: '17 8 * * 1'

concurrency:
  group: carga-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  carga:
    name: k6 contra el compose de carga
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Prueba de carga (build, siembra, k6, verificación)
        run: make carga
        env:
          CARGA_DURACION: ${{ inputs.duracion || '15m' }}
          CARGA_TECNICOS: ${{ inputs.tecnicos || '50' }}
          CARGA_PANEL: ${{ inputs.panel || '20' }}

      - name: Resumen en la página de la corrida
        if: always()
        run: |
          {
            echo '## Prueba de carga'
            echo '```'
            cat infra/carga/.salida/resumen.txt 2>/dev/null || echo 'k6 no dejó resumen'
            echo '```'
            echo '### Verificación de la base'
            echo '```'
            cat infra/carga/.salida/verificacion.txt 2>/dev/null || echo 'sin verificación'
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Logs de api y worker si falla
        if: failure()
        run: |
          docker compose -p iris-carga -f infra/docker-compose.yml -f infra/carga/compose.yml \
            --env-file .env.example --profile app logs --no-color --tail 300 api worker postgres \
            >infra/carga/.salida/compose.log 2>&1 || true

      - name: Subir resultados de k6
        if: always()
        # actions/upload-artifact v7.0.2 fijada por SHA (la misma de ci.yml).
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carga-${{ github.run_id }}
          path: |
            infra/carga/.salida/resumen.txt
            infra/carga/.salida/resumen.json
            infra/carga/.salida/verificacion.txt
            infra/carga/.salida/pg_top.txt
            infra/carga/.salida/compose.log
          retention-days: 30
          if-no-files-found: warn

      - name: Bajar el compose de carga
        if: always()
        run: make carga-limpiar
