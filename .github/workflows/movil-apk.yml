# APK de Android de la app de campo (apps/movil, Expo) compilado aquí mismo, sin EAS ni cuentas
# externas (decisión del PM). Runbook: docs/runbooks/movil-apk.md.
#
# - A mano: Actions → «APK de Android» → Run workflow, con la URL https de la API. Versión
#   0.0.0-dev+<sha corto>; el APK queda como artefacto (30 días).
# - Release publicada a mano: `release: published` compila esa versión y la adjunta.
# - En cada versión: release.yml lo llama como workflow reutilizable cuando release-please crea la
#   release (una release creada con GITHUB_TOKEN no dispara `release: published`), con la versión y
#   la URL de la variable del repo IRIS_MOVIL_API_URL, y lo adjunta a la GitHub Release como
#   iris-campo-<versión>.apk.
#
# Firma: con los secretos ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y
# ANDROID_KEY_PASSWORD (el keystore va a $RUNNER_TEMP y se borra). Sin ellos, con una llave de
# PRUEBA generada en el job: el archivo se llama iris-campo-<versión>-prueba.apk y no sirve para
# actualizar una instalación firmada con otra llave.
#
# No corre en PRs. Acciones fijadas por SHA; los inputs llegan a los scripts por `env:`.
name: APK de Android

on:
  # Releases creadas a mano (una persona o un token que no sea GITHUB_TOKEN). Las de release-please
  # llegan por workflow_call desde release.yml.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      api_url:
        description: URL https de la API de Iris (sin /api/v1), p. ej. https://iris.tuisp.gt
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: Versión (versionName), p. ej. 0.3.0
        required: true
        type: string
      tag:
        description: Etiqueta de la GitHub Release donde se adjunta el APK (vacía = no se adjunta)
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: movil-apk-${{ github.ref }}-${{ inputs.version || 'dispatch' }}
  cancel-in-progress: false

jobs:
  compilar:
    name: Compilar y firmar el APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      archivo: ${{ steps.firmar.outputs.archivo }}
    env:
      TZ: UTC
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
      # Dispatch: el input; release: la variable del repo. Se valida abajo.
      EXPO_PUBLIC_IRIS_API_URL: ${{ inputs.api_url || vars.IRIS_MOVIL_API_URL }}
      VERSION_ENTRADA: ${{ inputs.version || github.event.release.tag_name }}
      IRIS_MOVIL_VERSION_CODE: ${{ github.run_number }}
    defaults:
      run:
        working-directory: apps/movil
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Validar URL de la API y versión
        run: |
          if [[ -z "$EXPO_PUBLIC_IRIS_API_URL" ]]; then
            echo "::error::Falta la URL de la API: input api_url (a mano) o variable del repo IRIS_MOVIL_API_URL (en una versión)."
            exit 1
          fi
          if [[ "$EXPO_PUBLIC_IRIS_API_URL" != https://* ]]; then
            echo "::error::La URL de la API debe empezar con https:// (la app la exige fuera de desarrollo; validarUrlApi)."
            exit 1
          fi
          version="${VERSION_ENTRADA#v}"
          if [[ -z "$version" ]]; then
            version="0.0.0-dev+${GITHUB_SHA::7}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "::error::Versión no válida: $version"
            exit 1
          fi
          echo "IRIS_MOVIL_VERSION=$version" >>"$GITHUB_ENV"

      # Versión de pnpm desde "packageManager" del package.json raíz (como ci.yml).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependencias
        working-directory: .
        run: pnpm install --frozen-lockfile

      # El runner ubuntu-24.04 trae el Android SDK (ANDROID_HOME) con licencias aceptadas; Gradle
      # baja solo la plataforma o el NDK que falten.
      - name: Comprobar Android SDK
        run: |
          test -d "${ANDROID_HOME:?ANDROID_HOME vacío}" || { echo "::error::El runner no trae Android SDK"; exit 1; }
          find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1 | tee "$RUNNER_TEMP/build-tools"

      # CNG: android/ se genera aquí y no se commitea (apps/movil/.gitignore).
      - name: expo prebuild
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: gradlew assembleRelease
        working-directory: apps/movil/android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Firmar
        id: firmar
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          herramientas="$ANDROID_HOME/build-tools/$(cat "$RUNNER_TEMP/build-tools")"
          origen="android/app/build/outputs/apk/release/app-release.apk"
          keystore="$RUNNER_TEMP/iris-campo.jks"
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d >"$keystore"
            archivo="iris-campo-${IRIS_MOVIL_VERSION}.apk"
            prueba=false
          else
            # Llave de prueba de un solo uso: contraseña al azar, nunca se guarda.
            KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
            KEY_ALIAS=prueba
            echo "::add-mask::$KEYSTORE_PASSWORD"
            keytool -genkeypair -v -keystore "$keystore" -storetype PKCS12 -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 4096 -validity 30 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=Iris Campo PRUEBA, O=Iris, C=GT" >/dev/null 2>&1
            archivo="iris-campo-${IRIS_MOVIL_VERSION}-prueba.apk"
            prueba=true
          fi
          export KEYSTORE_PASSWORD KEY_PASSWORD
          mkdir -p "$RUNNER_TEMP/apk"
          destino="$RUNNER_TEMP/apk/$archivo"
          "$herramientas/apksigner" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$destino" "$origen"
          rm -f "$keystore"
          "$herramientas/apksigner" verify --print-certs "$destino" | grep -E "Signer #1 certificate (DN|SHA-256)" >"$RUNNER_TEMP/certificado"
          sha="$(sha256sum "$destino" | cut -d' ' -f1)"
          {
            echo "## APK de Android: \`$archivo\`"
            echo
            echo "- Versión: \`$IRIS_MOVIL_VERSION\` · versionCode \`$IRIS_MOVIL_VERSION_CODE\`"
            echo "- API: \`$EXPO_PUBLIC_IRIS_API_URL\`"
            echo "- SHA-256 del APK: \`$sha\`"
            echo "- Certificado: \`$(tr '\n' ' ' <"$RUNNER_TEMP/certificado")\`"
            if [[ "$prueba" == true ]]; then
              echo
              echo "> **APK de PRUEBA**: firmado con una llave generada en este job (faltan los secretos ANDROID_*)."
              echo "> No sirve para actualizar una instalación firmada con otra llave: hay que desinstalar antes."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          echo "archivo=$archivo" >>"$GITHUB_OUTPUT"

      - name: Subir artefacto
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.firmar.outputs.archivo }}
          path: ${{ runner.temp }}/apk/${{ steps.firmar.outputs.archivo }}
          retention-days: 30
          if-no-files-found: error

  publicar:
    name: Adjuntar a la GitHub Release
    needs: compilar
    if: inputs.tag || github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Única parte con escritura: subir el APK a la release.
    permissions:
      contents: write
    env:
      ARCHIVO: ${{ needs.compilar.outputs.archivo }}
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.compilar.outputs.archivo }}
          path: apk

      - name: gh release upload
        run: gh release upload "$TAG" "apk/$ARCHIVO" --clobber
