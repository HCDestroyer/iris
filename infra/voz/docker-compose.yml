# «Iris Voz»: Servidor de IA (contrato voz.md §4.7 y §4.10). Compose propio de ese servidor: no
# comparte red, volúmenes ni secretos con el de Iris. Sin Postgres, sin Redis, sin panel.
#
# Este archivo es la base (sin GPU). La instalación normal le suma docker-compose.gpu.yml (runtime de
# NVIDIA y el medidor); `--no-gpu` usa solo este, para pruebas.
#
# Único puerto publicado: el de control (la puerta: TLS 1.3, mTLS con huellas fijadas y firma en
# toda ruta). Ollama solo escucha en la red interna, que no tiene salida.
name: iris-voz

x-endurecido: &endurecido
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "7" }

services:
  puerta:
    <<: *endurecido
    image: ${IRIS_VOZ_REGISTRY:-ghcr.io/hcdestroyer}/iris-voz:${IRIS_VOZ_VERSION:?IRIS_VOZ_VERSION is required}
    command: [servir]
    user: "65532:65532"
    environment:
      IRIS_VOZ_PUERTO: "8443"
      IRIS_VOZ_ESTADO: /estado
      IRIS_VOZ_OLLAMA_URL: http://llm:11434
      IRIS_VOZ_MEDIDOR: ${IRIS_VOZ_MEDIDOR:-}
      IRIS_VOZ_MODELOS_DIR: /modelos
      # 0 = calcular con la VRAM y los modelos permitidos.
      IRIS_VOZ_LLM_SIMULTANEAS: ${IRIS_VOZ_LLM_SIMULTANEAS:-0}
      IRIS_VOZ_LLM_MAX_TOKENS: ${IRIS_VOZ_LLM_MAX_TOKENS:-4096}
    ports:
      - "${IRIS_VOZ_ESCUCHA:-0.0.0.0}:${IRIS_VOZ_PUERTO:-8443}:8443"
    volumes:
      - estado:/estado
      - modelos:/modelos:ro
    networks: [control, interna]
    depends_on: [llm]

  llm:
    <<: *endurecido
    image: ollama/ollama:0.12.10@sha256:e8c3d1f6ad16323bc40dc63eff0701d4fc32113f75a86b54b3e836eef8290de6
    user: "65532:65532"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /modelos
      # El cliente no decide ni cuánto queda cargado el modelo ni el contexto: los fija el paquete.
      OLLAMA_KEEP_ALIVE: ${IRIS_VOZ_LLM_KEEP_ALIVE:-30m}
      OLLAMA_CONTEXT_LENGTH: ${IRIS_VOZ_LLM_CONTEXTO:-8192}
      OLLAMA_NUM_PARALLEL: ${IRIS_VOZ_LLM_PARALELO:-4}
      OLLAMA_MAX_LOADED_MODELS: "1"
      # El volumen de modelos es de solo lectura: nada de limpiar ni de guardar historial.
      OLLAMA_NOPRUNE: "1"
      OLLAMA_NOHISTORY: "1"
      OLLAMA_DEBUG: "0"
      HOME: /tmp/casa
    tmpfs:
      - /tmp
    volumes:
      - modelos:/modelos:ro
    # Solo la red interna (sin salida): no puede descargar nada ni llamar a nadie.
    networks: [interna]

networks:
  # Por aquí entra Iris al puerto publicado. Solo la puerta está en ella.
  control: {}
  # Puerta ↔ Ollama. Sin salida a ninguna red.
  interna:
    internal: true

volumes:
  # Credenciales del canal (token, huella fijada, certificado). Nunca datos de clientes.
  estado: {}
  modelos: {}
