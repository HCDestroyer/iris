# Iris · entorno de desarrollo y laboratorio.
#
#   cp .env.example .env
#   make dev                         # postgres, redis, minio (+ bucket), mailpit (TLS) y osrm
#   infra/osrm/preparar.sh           # una vez: descarga y preprocesa Guatemala para osrm
#   make dev-app                     # además migrar, api, worker y web (perfil app)
#
# Sin make: infra/mailpit/certificados.sh y luego
#   docker compose -f infra/docker-compose.yml --env-file .env [--profile app] up -d
# El contexto de build de api/worker/web es la raíz del repo (..), con el Dockerfile de cada app.
# Runbooks: docs/runbooks/desarrollo.md y docs/runbooks/lab.md.

name: iris

# api, worker y migrar leen todas las variables de la API de ../.env.example y, encima, de ../.env
# (si existe). Aquí solo se fija lo que cambia dentro de la red del compose (nombres de servicio en
# lugar de localhost) y lo que el compose monta (CA del correo de dev).
x-api-env-file: &api-env-file
  - path: ../.env.example
    required: true
  - path: ../.env
    required: false

x-api-env: &api-env
  TZ: UTC
  PORT: '8080'
  IRIS_PUERTO: '8080'
  IRIS_DB_URL: postgres://${IRIS_PG_USUARIO:-iris}:${IRIS_PG_CONTRASENA:-iris}@postgres:5432/${IRIS_PG_BASE:-iris}?sslmode=disable
  IRIS_REDIS_URL: redis://redis:6379/0
  IRIS_ADJUNTOS_ALMACEN: s3
  IRIS_S3_ENDPOINT: http://minio:9000
  IRIS_OSRM_URL: http://osrm:5000
  IRIS_SMTP_HOST: mailpit
  IRIS_SMTP_PORT: '1025'
  IRIS_SMTP_TLS: starttls
  # Mailpit exige STARTTLS con un certificado de la CA de dev (infra/mailpit/certificados.sh).
  IRIS_CORREO_CA: /run/iris/correo-ca.pem
  # Correo, Argos y Horus pueden llamar a la red del compose (protección SSRF). Si el .env trae su
  # propia lista (p. ej. la red de Argos en lab), esa manda.
  IRIS_CORREO_REDES_PERMITIDAS: ${IRIS_CORREO_REDES_PERMITIDAS:-${IRIS_RED_COMPOSE:-172.28.10.0/24}}
  # El panel (web) hace de proxy de /api: la API cree su X-Forwarded-For solo si la conexión viene
  # de la IP fija de web (/32). Nunca la red entera: con un puerto publicado, Docker hace NAT y
  # lo que llega de fuera entra con la IP del gateway de esta red, que podría fijar su propio
  # X-Forwarded-For. Si el .env trae su propia lista, esa manda.
  IRIS_PROXIES_CONFIABLES: ${IRIS_PROXIES_CONFIABLES:-${IRIS_WEB_IP:-172.28.10.10}/32}

x-api-volumes: &api-volumes
  - ./mailpit/certs/ca.pem:/run/iris/correo-ca.pem:ro

x-api-build: &api-build
  context: ..
  dockerfile: apps/api/Dockerfile
  args:
    VERSION: ${IRIS_IMAGEN_TAG:-dev}
  secrets: [ca_extra]

x-api-depende: &api-depende
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio-init:
    condition: service_completed_successfully
  mailpit:
    condition: service_healthy
  migrar:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${IRIS_PG_USUARIO:-iris}
      POSTGRES_PASSWORD: ${IRIS_PG_CONTRASENA:-iris}
      POSTGRES_DB: ${IRIS_PG_BASE:-iris}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:${IRIS_PG_PUERTO:-5432}:5432
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20

  # Solo caché (CLAUDE.md: invalidación por evento). Sin persistencia en disco.
  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command: [redis-server, --save, '', --appendonly, 'no']
    ports:
      - 127.0.0.1:${IRIS_REDIS_PUERTO:-6379}:6379
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  # Adjuntos (fotos, firmas, documentos) en S3 compatible. Consola en :9001.
  # MinIO dejó de publicar imágenes en Docker Hub (minio/minio ya no existe): por defecto se usa el
  # fork comunitario pgsty/minio. IRIS_MINIO_IMAGEN/IRIS_MC_IMAGEN permiten usar un espejo propio.
  minio:
    image: ${IRIS_MINIO_IMAGEN:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    restart: unless-stopped
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER: ${IRIS_S3_ACCESS_KEY:-iris}
      MINIO_ROOT_PASSWORD: ${IRIS_S3_SECRET_KEY:-iris-dev-solo-local}
    volumes:
      - minio:/data
    ports:
      - 127.0.0.1:${IRIS_MINIO_PUERTO:-9000}:9000
      - 127.0.0.1:${IRIS_MINIO_CONSOLA_PUERTO:-9001}:9001

  # Crea el bucket de adjuntos al arrancar (idempotente) y termina. Espera a MinIO reintentando.
  minio-init:
    image: ${IRIS_MC_IMAGEN:-pgsty/mc:RELEASE.2026-09-16T00-00-00Z}
    depends_on:
      - minio
    environment:
      IRIS_S3_ACCESS_KEY: ${IRIS_S3_ACCESS_KEY:-iris}
      IRIS_S3_SECRET_KEY: ${IRIS_S3_SECRET_KEY:-iris-dev-solo-local}
      IRIS_S3_BUCKET: ${IRIS_S3_BUCKET:-iris-adjuntos}
    entrypoint: [/bin/sh, /crear-bucket.sh]
    volumes:
      - ./minio/crear-bucket.sh:/crear-bucket.sh:ro
    restart: 'no'

  # SMTP de prueba: todo correo saliente queda en la UI (http://localhost:8025). Con TLS: STARTTLS
  # obligatorio en :1025 (Iris nunca manda correo en claro) con el certificado de
  # infra/mailpit/certificados.sh (CA en certs/ca.pem → IRIS_CORREO_CA de api y worker).
  mailpit:
    image: axllent/mailpit:v1.31.3
    restart: unless-stopped
    environment:
      MP_SMTP_TLS_CERT: /certs/mailpit.pem
      MP_SMTP_TLS_KEY: /certs/mailpit.key
      MP_SMTP_REQUIRE_STARTTLS: 'true'
      # Acepta cualquier usuario y contraseña en el SMTP (los buzones de Iris siempre mandan uno).
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      TZ: UTC
    volumes:
      - ./mailpit/certs/mailpit.pem:/certs/mailpit.pem:ro
      - ./mailpit/certs/mailpit.key:/certs/mailpit.key:ro
    ports:
      - 127.0.0.1:${IRIS_MAILPIT_SMTP_PUERTO:-1025}:1025
      - 127.0.0.1:${IRIS_MAILPIT_UI_PUERTO:-8025}:8025
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 3s
      retries: 20

  # Rutas por calle (perfil car, MLD) sobre el extracto de Guatemala. Los datos los deja
  # infra/osrm/preparar.sh en el volumen osrm; sin ellos el servicio termina con un aviso.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    restart: on-failure:3
    volumes:
      - osrm:/data
    command:
      - /bin/sh
      - -c
      - |
        if [ ! -f /data/iris.osrm.mldgr ]; then
          echo "OSRM sin datos: corre infra/osrm/preparar.sh y vuelve a levantar osrm." >&2
          exit 1
        fi
        exec osrm-routed --algorithm mld --max-table-size 1000 /data/iris.osrm
    ports:
      - 127.0.0.1:${IRIS_OSRM_PUERTO:-5000}:5000

  # --- Perfil app: procesos de Iris construidos desde apps/ -----------------------------------
  # Migraciones (goose embebidas en el binario) y sincronización de permisos. Termina; api y worker
  # esperan a que salga bien (service_completed_successfully).
  migrar:
    profiles: [app]
    image: iris/api:${IRIS_IMAGEN_TAG:-dev}
    build:
      <<: *api-build
      target: api
    command: [migrar]
    env_file: *api-env-file
    environment: *api-env
    volumes: *api-volumes
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    profiles: [app]
    image: iris/api:${IRIS_IMAGEN_TAG:-dev}
    build:
      <<: *api-build
      target: api
    command: [servir]
    restart: unless-stopped
    env_file: *api-env-file
    environment: *api-env
    volumes: *api-volumes
    depends_on: *api-depende
    # La imagen es distroless (sin shell ni curl): `iris salud` hace el GET a /api/v1/salud local
    # en $PORT y sale 0 o 1.
    healthcheck:
      test: [CMD, /usr/local/bin/iris, salud]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - 127.0.0.1:${IRIS_API_PUERTO:-8080}:8080

  # cmd/worker (River): outbox, webhooks entrantes de Argos y Horus, correo, crons. Necesita
  # IRIS_BASE_URL e IRIS_CLAVE_CIFRADO igual que la API (descifra tokens y contraseñas).
  worker:
    profiles: [app]
    image: iris/worker:${IRIS_IMAGEN_TAG:-dev}
    build:
      <<: *api-build
      target: worker
    restart: unless-stopped
    env_file: *api-env-file
    environment: *api-env
    volumes: *api-volumes
    depends_on: *api-depende

  web:
    profiles: [app]
    image: iris/web:${IRIS_IMAGEN_TAG:-dev}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      secrets: [ca_extra]
    restart: unless-stopped
    environment:
      TZ: UTC
      PORT: '3000'
      # Standalone de Next: escuchar en todas las interfaces del contenedor.
      HOSTNAME: 0.0.0.0
      # Llamadas del servidor de Next a la API dentro de la red del compose.
      IRIS_API_URL: http://api:8080
      IRIS_BASE_URL: ${IRIS_BASE_URL:-http://localhost:3000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 127.0.0.1:${IRIS_WEB_PUERTO:-3000}:3000
    # IP fija: la única en que la API confía para X-Forwarded-For (IRIS_PROXIES_CONFIABLES). Debe
    # estar dentro de IRIS_RED_COMPOSE y fuera de su gateway (.1).
    networks:
      default:
        ipv4_address: ${IRIS_WEB_IP:-172.28.10.10}

# Red con subred fija: IRIS_CORREO_REDES_PERMITIDAS la usa por defecto (Mailpit vive aquí) y web
# tiene una IP fija dentro de ella (IRIS_WEB_IP).
networks:
  default:
    ipam:
      config:
        - subnet: ${IRIS_RED_COMPOSE:-172.28.10.0/24}

# CA extra solo para construir detrás de un proxy que intercepta TLS (por defecto un archivo vacío;
# ver infra/imagenes/README.md). No queda en las imágenes.
secrets:
  ca_extra:
    file: ${IRIS_BUILD_CA_EXTRA:-./imagenes/sin-ca.pem}

volumes:
  pgdata:
  minio:
  osrm:
