# sqlc: SQL tipado. El código generado se commitea (`sqlc generate`; CI verifica `sqlc diff`).
# El esquema son las migraciones goose (sqlc ignora las secciones Down).
version: "2"
sql:
  - &base
    engine: postgresql
    schema: migraciones
    queries: internal/auditoria/consultas.sql
    gen:
      go: &gen
        package: auditoriabd
        out: internal/auditoria/bd
        sql_package: pgx/v5
        emit_json_tags: false
        emit_pointers_for_null_types: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
  - <<: *base
    queries: internal/integracion/consultas.sql
    gen:
      go:
        <<: *gen
        package: integracionbd
        out: internal/integracion/bd
  - <<: *base
    queries: internal/nucleo/consultas.sql
    gen:
      go:
        <<: *gen
        package: nucleobd
        out: internal/nucleo/bd
  - <<: *base
    queries: internal/nucleo/identidad/consultas.sql
    gen:
      go:
        <<: *gen
        package: identidadbd
        out: internal/nucleo/identidad/bd
  - <<: *base
    queries: internal/nucleo/clave/consultas.sql
    gen:
      go:
        <<: *gen
        package: clavebd
        out: internal/nucleo/clave/bd
  - <<: *base
    queries: internal/integracion/conector/consultas.sql
    gen:
      go:
        <<: *gen
        package: conectorbd
        out: internal/integracion/conector/bd
  - <<: *base
    queries: internal/integracion/argos/consultas.sql
    gen:
      go:
        <<: *gen
        package: argosbd
        out: internal/integracion/argos/bd
  - <<: *base
    queries: internal/nucleo/adjuntos/consultas.sql
    gen:
      go:
        <<: *gen
        package: adjuntosbd
        out: internal/nucleo/adjuntos/bd
  - <<: *base
    queries: internal/integracion/pendientes/consultas.sql
    gen:
      go:
        <<: *gen
        package: pendientesbd
        out: internal/integracion/pendientes/bd
  - <<: *base
    queries: [internal/soporte/consultas.sql, internal/soporte/consultas_correo.sql, internal/soporte/consultas_horus.sql,
      internal/soporte/consultas_portal.sql]
    gen:
      go:
        <<: *gen
        package: soportebd
        out: internal/soporte/bd
        rename:
          soporte_buzone: SoporteBuzon
  - <<: *base
    queries: internal/campo/consultas.sql
    gen:
      go:
        <<: *gen
        package: campobd
        out: internal/campo/bd
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
        rename:
          campo_ordene: CampoOrden
          campo_orden_materiale: CampoOrdenMaterial
          campo_posicione: CampoPosicion
          campo_posiciones_ultima: CampoPosicionUltima
          campo_plantilla_versione: CampoPlantillaVersion
  - <<: *base
    queries: internal/agenda/consultas.sql
    gen:
      go:
        <<: *gen
        package: agendabd
        out: internal/agenda/bd
        overrides:
          - db_type: date
            go_type: time.Time
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
        rename:
          agenda_capacidade: AgendaCapacidad
  - <<: *base
    queries: internal/comercial/consultas.sql
    gen:
      go:
        <<: *gen
        package: comercialbd
        out: internal/comercial/bd
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
        rename:
          comercial_cotizacione: ComercialCotizacion
          comercial_actividade: ComercialActividad
          comercial_factibilidade: ComercialFactibilidad
  - <<: *base
    queries: internal/reportes/consultas.sql
    gen:
      go:
        <<: *gen
        package: reportesbd
        out: internal/reportes/bd
