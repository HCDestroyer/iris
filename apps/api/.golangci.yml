# golangci-lint v2 para apps/api (lo corre `make lint` y CI).
version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - nolintlint
    - unconvert
  settings:
    gosec:
      excludes:
        - G104 # ya lo cubre errcheck
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errorlint]
      - path: internal/.*/bd/
        linters: [gosec]
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/HCDestroyer/iris
